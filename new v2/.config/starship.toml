"$schema" = 'https://starship.rs/config-schema.json'
# Monochrome recolor (2026-11-12): grays fade into the black Ghostty background; original pastel config in starship.toml.bak-2026-11-12

format = """
[](#3a3a3a)\
$os\
$username\
[](bg:#2e2e2e fg:#3a3a3a)\
$directory\
[](fg:#2e2e2e bg:#242424)\
$git_branch\
$git_status\
[](fg:#242424 bg:#1c1c1c)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:#1c1c1c bg:#151515)\
$docker_context\
[](fg:#151515 bg:#0e0e0e)\
$time\
[ ](fg:#0e0e0e)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#3a3a3a fg:#e8e8e8"
style_root = "bg:#3a3a3a fg:#ffffff"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#3a3a3a fg:#e8e8e8"
disabled = true # Disabled by default

[directory]
style = "bg:#2e2e2e fg:#d0d0d0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#1c1c1c fg:#b4b4b4"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#1c1c1c fg:#b4b4b4"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#151515 fg:#9a9a9a"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#1c1c1c fg:#b4b4b4"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#1c1c1c fg:#b4b4b4"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#242424 fg:#b4b4b4"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#242424 fg:#b4b4b4"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#1c1c1c fg:#b4b4b4"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#1c1c1c fg:#b4b4b4"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#1c1c1c fg:#b4b4b4"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#1c1c1c fg:#b4b4b4"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#1c1c1c fg:#b4b4b4"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#1c1c1c fg:#b4b4b4"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#1c1c1c fg:#b4b4b4"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#1c1c1c fg:#b4b4b4"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#1c1c1c fg:#b4b4b4"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#0e0e0e fg:#8a8a8a"
format = '[ ♥ $time ]($style)'
